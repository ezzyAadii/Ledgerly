name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_PATH: ':memory:'
      JWT_SECRET: test-secret-for-ci-only-at-least-32-characters
      VITE_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate Docker Compose
        run: JWT_SECRET=ci-only-secret-at-least-32-characters docker compose config --quiet
      - name: Build containers
        run: JWT_SECRET=ci-only-secret-at-least-32-characters docker compose build
